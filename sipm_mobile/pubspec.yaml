name: sipm_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.0
  dio: ^5.9.0
  go_router: ^14.0.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  pinput: ^5.0.0
  shared_preferences: ^2.3.2
  signalr_netcore: ^1.4.4
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.1
  file_picker: ^8.3.7
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  equatable: ^2.0.8
  gal: ^2.3.2
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0
  xml: ^6.6.1
  # WebRTC/Video Call removed
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_app.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1220"
  image: "assets/icons/ic_app.png"
  android_12:
    image: "assets/icons/ic_app.png"
    icon_background_color: "#0B1220"
    color: "#0B1220"

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/localization/

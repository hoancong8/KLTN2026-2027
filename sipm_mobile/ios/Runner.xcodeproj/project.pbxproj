			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "APP_PATH=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\necho \"=== Strip Simulator Slices: $APP_PATH ===\"\n\n# Step 1: Remove simulator-only frameworks (only x86_64, no arm64)\nfind \"$APP_PATH\" -name '*.framework' -type d | while read -r FRAMEWORK; do\n    EXEC_NAME=$(basename \"$FRAMEWORK\" .framework)\n    EXEC_PATH=\"$FRAMEWORK/$EXEC_NAME\"\n    if [ -f \"$EXEC_PATH\" ]; then\n        ARCHS=$(lipo -archs \"$EXEC_PATH\" 2>/dev/null || echo \"\")\n        if echo \"$ARCHS\" | grep -q 'x86_64'; then\n            if echo \"$ARCHS\" | grep -qE 'arm64|armv7'; then\n                echo \"Stripping x86_64 from fat binary: $EXEC_NAME (was: $ARCHS)\"\n                lipo -remove x86_64 -output \"${EXEC_PATH}.tmp\" \"$EXEC_PATH\" 2>/dev/null && mv \"${EXEC_PATH}.tmp\" \"$EXEC_PATH\"\n                echo \"  -> After strip: $(lipo -archs \\\"$EXEC_PATH\\\")\"\n            else\n                echo \"Removing simulator-only framework: $FRAMEWORK (archs: $ARCHS)\"\n                rm -rf \"$FRAMEWORK\"\n            fi\n        fi\n    fi\ndone\n\n# Step 2: Remove leftover simulator-only loose Mach-O binaries\nfind \"$APP_PATH\" -type f | while read -r BINARY; do\n    if file \"$BINARY\" | grep -q 'Mach-O'; then\n        ARCHS=$(lipo -archs \"$BINARY\" 2>/dev/null || echo \"\")\n        if echo \"$ARCHS\" | grep -q 'x86_64' && ! echo \"$ARCHS\" | grep -qE 'arm64|armv7'; then\n            echo \"Removing simulator-only binary: $BINARY (archs: $ARCHS)\"\n            rm -f \"$BINARY\"\n        fi\n    fi\ndone\n\necho \"=== Done ===\"\n";

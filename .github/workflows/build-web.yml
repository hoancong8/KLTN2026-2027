name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ master, main ]
    paths:
      - 'KLTN2026-2027/**'
      - '.github/workflows/build-web.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'KLTN2026-2027/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: KLTN2026-2027

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Cài đặt dependencies
        run: flutter pub get

      - name: 🌐 Build Flutter Web
        env:
          ENV: ${{ secrets.ENV || 'prod' }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          # Tự động lấy tên repository làm base-href (ví dụ /KLTN2026-2027/)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          CMD="flutter build web --release --base-href=/${REPO_NAME}/ --dart-define=ENV=${ENV}"
          
          if [ -n "${BASE_URL}" ]; then
            CMD="$CMD --dart-define=BASE_URL=${BASE_URL}"
          fi
          
          echo "Executing: $CMD"
          eval $CMD
          
          # Fix lỗi 404 khi người dùng F5 tải lại trang trên GitHub Pages (SPA Routing)
          cp build/web/index.html build/web/404.html

      - name: 📤 Upload Web Build Artifact (Dự phòng tải về)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: KLTN2026-2027/build/web/
          retention-days: 14

      # =========================================================================
      # DEPLOY LÊN GITHUB PAGES
      # =========================================================================
      - name: ⚙️ Cấu hình GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 📦 Đóng gói artifact cho GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: KLTN2026-2027/build/web/

      - name: 🚀 Deploy lên GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

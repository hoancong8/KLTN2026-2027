name: Build Android APK

on:
  push:
    branches: [ master, main ]
    paths:
      - 'KLTN2026-2027/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'KLTN2026-2027/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KLTN2026-2027

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: 🧹 Dọn dẹp cache Flutter
        run: flutter clean

      - name: 📦 Cài đặt dependencies
        run: flutter pub get

      - name: 🔧 Cấp quyền thực thi cho gradlew (nếu có)
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 📱 Build Android APK
        env:
          ENV: ${{ secrets.ENV || 'prod' }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_NAME="1.1.${{ github.run_number }}"
          
          CMD="flutter build apk --release --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER} --dart-define=ENV=${ENV}"
          
          if [ -n "${BASE_URL}" ]; then
            CMD="$CMD --dart-define=BASE_URL=${BASE_URL}"
          fi
          
          echo "Executing: $CMD"
          eval $CMD
          
          # Đổi tên file APK theo số build và commit SHA ngắn để tránh nhầm lẫn khi tải về
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="sipm-v${BUILD_NAME}-b${BUILD_NUMBER}-${SHORT_SHA}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sipm-apk-r${{ github.run_number }}
          path: |
            KLTN2026-2027/build/app/outputs/flutter-apk/sipm-*.apk
            KLTN2026-2027/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
